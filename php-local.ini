; OPcache cho local dev server.
; KHÔNG dùng `-c` cho file này (nó thay thế toàn bộ php.ini -> mất pdo_mysql).
; Cách dùng đúng: giữ nguyên php.ini mặc định và thêm các -d tương đương khi start:
;   php -S localhost:8000 -d opcache.enable=1 -d opcache.enable_cli=1 \
;       -d opcache.memory_consumption=128 -d opcache.revalidate_freq=60
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
opcache.revalidate_freq=60
opcache.save_comments=1
opcache.fast_shutdown=1
